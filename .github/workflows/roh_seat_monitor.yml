name: ROH Seat Monitor

on:
  workflow_dispatch: {}  # triggered externally (Azure Function) via the GitHub API,
                          # and can also be run manually from the Actions tab

jobs:
  check-seats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      # Restores last_state.json from the previous run so we can tell
      # whether new seats appeared since last time. Without this, every
      # run would look like a "first run" and never alert.
      - name: Restore seat state
        uses: actions/cache/restore@v4
        with:
          path: last_state.json
          key: roh-state-fixed

      - name: Run seat check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          COOKIE_HEADER: ${{ secrets.COOKIE_HEADER }}
        run: python roh_seat_monitor.py

      # GitHub's cache is write-once per key, so to keep just ONE cache
      # entry (instead of accumulating one per run) we delete the old
      # one under this key before saving the fresh state. "|| true"
      # means a missing cache (first-ever run) doesn't fail the step.
      - name: Delete old seat state cache
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete roh-state-fixed || true

      - name: Save seat state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: last_state.json
          key: roh-state-fixed
