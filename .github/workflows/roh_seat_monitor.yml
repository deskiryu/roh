name: ROH Seat Monitor

on:
  schedule:
    # Runs every 5 minutes (GitHub's minimum granularity for scheduled
    # workflows). Cron is UTC. Des Commite
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab

jobs:
  check-seats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      # Restores last_state.json from the previous run so we can tell
      # whether new seats appeared since last time. Without this, every
      # run would look like a "first run" and never alert.
      - name: Restore seat state
        uses: actions/cache/restore@v4
        with:
          path: last_state.json
          key: roh-state-${{ github.run_id }}
          restore-keys: |
            roh-state-

      - name: Run seat check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          COOKIE_HEADER: ${{ secrets.COOKIE_HEADER }}
        run: python roh_seat_monitor.py

      # Saves the updated last_state.json so next run can diff against it.
      - name: Save seat state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: last_state.json
          key: roh-state-${{ github.run_id }}
